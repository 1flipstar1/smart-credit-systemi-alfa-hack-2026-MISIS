services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: credit_cabinet
      POSTGRES_USER: credit_user
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_user -d credit_cabinet"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://credit_user:change_me_local_only@db:5432/credit_cabinet
      UPLOAD_DIR: /app/data/uploads
      SCORING_MODEL_PATH: /app/ml_models/scoring/model.joblib
      SCORING_MODEL_VERSION: local-unconfigured
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  document-worker:
    build: .
    command: ["python", "-m", "app.workers.document_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://credit_user:change_me_local_only@db:5432/credit_cabinet
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
