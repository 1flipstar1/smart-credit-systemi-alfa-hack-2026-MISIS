<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Бизнес — тестовая серия промоассетов</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font:16px/1.5 Arial,sans-serif}main{max-width:1440px;margin:auto;padding:48px 32px}header{max-width:850px}h1{font-size:clamp(30px,4vw,52px);line-height:1.05;letter-spacing:-2px;margin:16px 0}p{color:#666}nav{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0}button,a.download{font:inherit;color:inherit;border:0;border-radius:12px;padding:10px 16px;background:#eee;cursor:pointer}button[aria-pressed=true]{background:#242424;color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}article{min-width:0}.stage{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:28px;background:var(--surface,#f2f3f5);transition:background .2s}.stage img{width:94%;height:94%;object-fit:contain}h2{font-size:19px;margin:14px 0 3px}small{color:#777;display:block}.download{display:inline-block;margin:12px 0;text-decoration:none;font-size:13px!important;padding:7px 12px!important}footer{margin-top:40px;color:#666}footer a{color:inherit}body[data-bg=dark]{--surface:#202024}body[data-bg=pink]{--surface:#ffddda}body[data-bg=cyan]{--surface:#c4f5f7}body[data-bg=checker]{--surface:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0/20px 20px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){main{padding:28px 16px}.grid{gap:12px}h2{font-size:16px}.stage{border-radius:20px}}
</style><main><header><small>БИБЛИОТЕКА UI / ТЕСТОВАЯ СЕРИЯ</small><h1>Бизнес в объёме</h1><p>8 новых предметных композиций по мотивам промобиблиотеки: красный лак, бирюзовый металл, золото и серебро. Отдельные PNG с прозрачным фоном.</p></header><nav aria-label="Фон предпросмотра"><button data-bg="light" aria-pressed="true">Светлый</button><button data-bg="dark" aria-pressed="false">Тёмный</button><button data-bg="pink" aria-pressed="false">Розовый</button><button data-bg="cyan" aria-pressed="false">Голубой</button><button data-bg="checker" aria-pressed="false">Прозрачность</button></nav><section class="grid" id="assets"></section><footer><a href="STYLE-ANALYSIS.md">Разбор всех 30 референсов</a> · <a href="prompts.json">Запросы генерации</a> · <a href="manifest.json">Характеристики PNG</a></footer></main>
<script>
const items=[['01-business-briefcase','Бизнес-портфель','Управление и развитие'],['02-business-bank','Банк','Банковские услуги'],['03-business-savings','Копилка','Накопления и резерв'],['04-merchant-terminal','Платёжный терминал','Эквайринг и продажи'],['05-secure-account','Защищённый счёт','Сохранность средств'],['06-business-growth','Рост бизнеса','Выручка и аналитика'],['07-global-payments','Международные переводы','Расчёты и обмен'],['08-startup-financing','Финансирование старта','Запуск нового бизнеса']];
document.getElementById('assets').innerHTML=items.map(([file,title,desc])=>`<article><div class="stage"><img src="${file}.png" alt="${title}"></div><h2>${title}</h2><small>${desc}</small><a class="download" href="${file}.png" download>Скачать PNG ↓</a></article>`).join('');
document.querySelectorAll('button[data-bg]').forEach(button=>button.onclick=()=>{document.body.dataset.bg=button.dataset.bg;document.querySelectorAll('button[data-bg]').forEach(b=>b.setAttribute('aria-pressed',b===button?'true':'false'))});
</script></html>
